<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Underware Examples</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #1a1a1a;
      color: #e0e0e0;
      padding: 32px 24px 64px;
    }

    #home-btn {
      position: fixed;
      top: 12px;
      left: 12px;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(18, 18, 18, 0.9);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid #2e2e2e;
      border-radius: 9px;
      color: #aaa;
      text-decoration: none;
      transition: color 0.12s, border-color 0.12s;
      box-shadow: 0 4px 24px rgba(0,0,0,0.4);
      z-index: 10;
    }

    #home-btn:hover { color: #e8e8e8; border-color: #4a9eff; }
    #home-btn svg { width: 18px; height: 18px; }

    header { max-width: 1100px; margin: 0 auto 32px; padding-left: 52px; }
    h1 { font-size: 22px; margin-bottom: 8px; }
    header p { font-size: 14px; color: #999; line-height: 1.5; max-width: 640px; }
    header a { color: #4a9eff; }

    #prompt-toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
      font-size: 13px;
      color: #c8c8c8;
      cursor: pointer;
      user-select: none;
    }

    #prompt-toggle input { display: none; }

    .toggle-track {
      width: 36px;
      height: 20px;
      flex-shrink: 0;
      background: #2e2e2e;
      border-radius: 10px;
      position: relative;
      transition: background 0.15s;
    }

    .toggle-thumb {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      background: #999;
      border-radius: 50%;
      transition: transform 0.15s, background 0.15s;
    }

    #prompt-toggle input:checked + .toggle-track { background: #2a5a8a; }
    #prompt-toggle input:checked + .toggle-track .toggle-thumb { transform: translateX(16px); background: #4a9eff; }

    #grid {
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }

    #grid.list-view {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card {
      display: block;
      background: #1e1e1e;
      border: 1px solid #2e2e2e;
      border-radius: 10px;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.12s, transform 0.12s;
    }

    .card:hover { border-color: #4a9eff; transform: translateY(-2px); }

    .card img {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      background: #1a1a1a;
    }

    .card-label {
      padding: 10px 12px;
      font-size: 13px;
      font-weight: 500;
    }

    .card-prompt { display: none; }

    #grid.list-view .card {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 16px 20px;
    }

    #grid.list-view .card-prompt {
      display: block;
      flex: 1;
      font-size: 14px;
      color: #c8c8c8;
      font-style: italic;
    }

    #grid.list-view .card-visual {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
      width: 320px;
    }

    #grid.list-view .card-visual img {
      width: 140px;
      height: 105px;
      border-radius: 6px;
      flex-shrink: 0;
      aspect-ratio: 4 / 3;
    }

    #grid.list-view .card-label { padding: 0; }
  </style>
</head>
<body>

<a id="home-btn" href="./index.html" title="Home" aria-label="Home">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 11.5 L12 4 L21 11.5"/>
    <path d="M5.5 10 V20 H18.5 V10"/>
  </svg>
</a>

<header>
  <h1>Underware Examples</h1>
  <p>Every shape the Underware skill can render, with defaults applied. Click one to render it live in 3D and download the STL. See <a href="./SKILL.md">SKILL.md</a> for the full parameter list each shape accepts.</p>
  <label id="prompt-toggle">
    <input type="checkbox" id="prompt-toggle-input" checked>
    <span class="toggle-track"><span class="toggle-thumb"></span></span>
    Show Prompts
  </label>
</header>

<div id="grid"></div>

<script>
  // One representative item per shape the skill can render (see SKILL.md).
  const EXAMPLES = [
    { slug: 'i-channel', component: 'Underware_I_Channel.scad', params: { Channel_Width_in_Units: 2, Channel_Internal_Height: 24, Channel_Length_Units: 5, Mounting_Method: 'Threaded Snap Connector', Base_Top_or_Both: 'Both' }, label: 'I-Channel (Straight)', prompt: 'A 2-unit wide, 5-unit long straight cable channel, 24mm internal height, with a threaded snap connector mount.' },
    { slug: 'l-channel', component: 'Underware_L_Channel.scad', params: { L_Channel_Length_in_Units_X_Axis: 2, L_Channel_Length_in_Units_Y_Axis: 2, Mounting_Method: 'Threaded Snap Connector' }, label: 'L-Channel (Corner)', prompt: 'A 90 degree corner channel, 2 units long on each leg, threaded snap connector mount.' },
    { slug: 't-channel', component: 'Underware_T_Channel.scad', params: { Corner_Style: 'Round', Mounting_Method: 'Threaded Snap Connector' }, label: 'T-Channel (Junction)', prompt: 'A T junction channel with rounded corners, splitting a cable run three ways.' },
    { slug: 'x-channel', component: 'Underware_X_Channel.scad', params: { Channel_X_Width_X_in_Units: 2, Channel_Y_Width_in_Units: 2 }, label: 'X-Channel (Cross)', prompt: 'A four-way cross channel, 2 units wide in each direction.' },
    { slug: 'branch-split-channel', component: 'Underware_Branch_Split_Channel.scad', params: { Channel_Width_in_Units: 1, Mounting_Method: 'Threaded Snap Connector' }, label: 'Branch Split Channel', prompt: 'A 1-unit wide channel that branches off to the side at an angle.' },
    { slug: 'y-channel', component: 'Underware_Y_Channel.scad', params: { Y_Units_Over: 2, Y_Units_Up: 2, Y_Output_Direction: 'Forward', Y_Straight_Distance: 25 }, label: 'Y-Channel (Split)', prompt: 'A Y-shaped channel splitting into two paths, spreading 2 units over and 2 units up.' },
    { slug: 's-channel', component: 'Underware_S_Channel.scad', params: { Units_Over: 3, Units_Up: 2 }, label: 'S-Channel (Diagonal)', prompt: 'An S-curve channel offsetting a cable run 3 units sideways and 2 units up without turning.' },
    { slug: 'diagonal-channel', component: 'Underware_Diagonal_Channel.scad', params: { Units_Over: 2, Units_Up: 2, Output_Direction: 'Turn', Straight_Distance: 25 }, label: 'Diagonal Channel', prompt: 'A diagonal channel offsetting 2 units over and 2 units up, then turning 90 degrees at the end.' },
    { slug: 'c-channel', component: 'Underware_C_Channel.scad', params: { Curve_Radius_in_Units: 3 }, label: 'C-Channel (Curved)', prompt: 'A curved channel with a 3-unit radius for a smooth arc around a corner.' },
    { slug: 'mitre-channel', component: 'Underware_Mitre_Channel.scad', params: { Length_of_Longest_Edge_1: 100, Length_of_Longest_Edge_2: 60 }, label: 'Mitre Channel', prompt: 'A mitred 45 degree corner channel, 100mm on one edge and 60mm on the other.' },
    { slug: 'height-change-channel', component: 'Underware_Height_Change_Channel.scad', params: { Channel_Internal_Height_1: 12, Channel_Internal_Height_2: 24, Channel_Length_Units: 4, Rise_Distance: 40 }, label: 'Height Change Channel', prompt: 'A channel that steps up from 12mm to 24mm internal height over a 4-unit run.' },
    { slug: 'transition-channel', component: 'Underware_Transition_Channel.scad', params: { Channel_Width_in_Units_1: 2, Channel_Width_in_Units_2: 1, Channel_Internal_Height_1: 18, Channel_Internal_Height_2: 12, Channel_Length_Units: 3 }, label: 'Transition Channel', prompt: 'A channel transitioning from 2 units wide down to 1, and 18mm down to 12mm tall, over 3 units.' },
    { slug: 'item-holder', component: 'Underware_Item_Holder.scad', params: { Mounting_Style: 'Multiconnect', Mounting_Surface: 'Multiboard', Internal_Width: 80, Internal_Depth: 60, Internal_Height: 30, frontCutout: true }, label: 'Item Holder', prompt: 'An open-front basket, 80 by 60 by 30mm inside, to hold a small power brick, using the Multiboard grid system.' },
    { slug: 'clamshell-holder', component: 'Underware_Item_Holder_Clamshell_Style.scad', params: { Mounting_Surface: 'Multiboard', total_item_width: 150 }, label: 'Clamshell Holder', prompt: 'An enclosed clamshell holder that grips a 150mm wide item on both sides, mounted to the Multiboard grid system.' },
    { slug: 'hook', component: 'Underware_Hooks.scad', params: { Connection_Type: 'Multiconnect', Width: 40, Depth: 30, Height: 25 }, label: 'Hook', prompt: 'A wall hook 40mm wide and 30mm deep for hanging a headset, Multiconnect mount.' },
    { slug: 'cable-loop-holder', component: 'Underware_Cable_Loop_holder.scad', params: { Connection_Type: 'Multiconnect', holderHeight: 50, holderDiameter: 45 }, label: 'Cable Loop Holder', prompt: 'A post to wrap and store a coiled cable, 45mm diameter and 50mm tall, Multiconnect mount.' },
    { slug: 'keyhole-test-jig', component: 'Underware_keyholes.scad', params: { Show_Part: 'Keyhole Test', Mounting_Surface: 'Multiboard' }, label: 'Keyhole Test Jig', prompt: 'A test jig to check the fit of a Multiboard keyhole mount before printing the real part.' },
    { slug: 'bolt-connector', component: 'Underware_Connectors.scad', params: { Show_Part: 'Bolts', Bolt_Selection: 'Small MB Screw' }, label: 'Bolt Connector', prompt: 'A bolt-mounted connector for attaching channels to a board, using a small MB screw.' },
  ];

  const grid = document.getElementById('grid');
  for (const ex of EXAMPLES) {
    const hash = encodeURIComponent(JSON.stringify([{ component: ex.component, params: ex.params, label: ex.label }]));
    const a = document.createElement('a');
    a.className = 'card';
    a.href = `./index.html#${hash}`;
    a.innerHTML = `<div class="card-prompt">&ldquo;${ex.prompt}&rdquo;</div>
      <div class="card-visual">
        <img src="./examples/${ex.slug}.png" alt="${ex.label}" loading="lazy">
        <div class="card-label">${ex.label}</div>
      </div>`;
    grid.appendChild(a);
  }

  const promptToggle = document.getElementById('prompt-toggle-input');
  grid.classList.toggle('list-view', promptToggle.checked);
  promptToggle.addEventListener('change', (e) => {
    grid.classList.toggle('list-view', e.target.checked);
  });
</script>
</body>
</html>
